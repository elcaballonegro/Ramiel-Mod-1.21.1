modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}

A fan project. Ramiel and the Evangelion setting belong to their respective rights holders;
this mod is not affiliated with or endorsed by them.'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "BOTH"

# Rimulib: the public API (CarveApi, FilmApi, FxApi ...) arrived in 1.2.2.
[[dependencies.${mod_id}]]
modId = "rimulib"
type = "required"
versionRange = "[1.2.2,)"
ordering = "AFTER"
side = "BOTH"
